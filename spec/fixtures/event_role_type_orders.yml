<% fixture_index = 0 %>
<% Event.all_types.each do |event_type| %>
<%   event_type.role_types.each_with_index do |role_type, index| %>
<%     fixture_index += 1 %>
event_role_type_<%= fixture_index %>:
  name: <%= role_type %>
  order_weight: <%= index + 1 %>
<%   end %>
<% end %>
